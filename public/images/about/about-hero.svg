<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 80 620 430" width="100%" height="100%" fill="none">
  <!-- Background Blob -->
  <path d="M 220 200 C 350 100, 620 120, 680 260 C 740 400, 600 520, 400 480 C 200 440, 100 300, 220 200 Z" fill="#EEF9D8" opacity="0.75" />

  <!-- Floating Dots (Left Top & Right Bottom) -->
  <g fill="#9A9A9A" opacity="0.25">
    <circle cx="120" cy="180" r="3" />
    <circle cx="140" cy="180" r="3" />
    <circle cx="160" cy="180" r="3" />
    <circle cx="120" cy="200" r="3" />
    <circle cx="140" cy="200" r="3" />
    <circle cx="160" cy="200" r="3" />
    <circle cx="120" cy="220" r="3" />
    <circle cx="140" cy="220" r="3" />
    <circle cx="160" cy="220" r="3" />
    
    <circle cx="680" cy="460" r="3" />
    <circle cx="700" cy="460" r="3" />
    <circle cx="680" cy="480" r="3" />
    <circle cx="700" cy="480" r="3" />
  </g>

  <!-- Puzzle Pieces Assembled -->
  <g stroke="#101010" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF">
    <!-- Top Puzzle Piece (Held by Top Person) -->
    <path d="M 400,160 L 510,160 C 510,180 525,190 535,175 C 545,160 560,170 560,190 L 560,260 L 490,260 C 490,240 475,230 465,245 C 455,260 440,250 440,230 L 400,230 Z" />

    <!-- Left Puzzle Piece (Held by Left Person) -->
    <path d="M 320,230 L 440,230 C 440,250 455,260 465,245 C 475,230 490,240 490,260 L 490,360 L 370,360 C 370,340 355,330 345,345 C 335,360 320,350 320,330 Z" fill="#A6E22E" opacity="0.9" />

    <!-- Center Puzzle Piece with Adeogram Logo -->
    <path d="M 490,260 L 600,260 C 600,280 615,290 625,275 C 635,260 650,270 650,290 L 650,400 L 530,400 C 530,380 515,370 505,385 C 495,400 480,390 480,370 L 480,310 L 490,310 Z" />
    
    <!-- Right Puzzle Piece (Held by Bottom Right Person) -->
    <path d="M 530,400 L 650,400 C 650,420 665,430 675,415 C 685,400 700,410 700,430 L 700,490 L 580,490 C 580,470 565,460 555,475 C 545,490 530,480 530,460 Z" fill="#EEF9D8" />
  </g>

  <!-- Adeogram Logo Graphic in the center puzzle piece -->
  <g transform="translate(535, 305)" stroke="#A6E22E" stroke-width="5" stroke-linecap="round" fill="none">
    <rect x="5" y="5" width="50" height="50" rx="12" stroke="#101010" stroke-width="4" fill="#FFFFFF" />
    <path d="M 30,17 C 22,17 17,22 17,30 C 17,38 22,43 30,43 C 38,43 43,38 43,30 C 43,20 35,13 26,17 C 20,20 21,29 27,29 C 31,29 33,26 32,22" stroke-width="3.5" />
    <circle cx="30" cy="30" r="3" fill="#A6E22E" stroke="none" />
  </g>

  <!-- People Line Art Illustrations (Outline style) -->
  <g stroke="#101010" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Person (Assembling green puzzle piece) -->
    <!-- Head -->
    <circle cx="390" cy="190" r="18" fill="#FFFFFF" />
    <!-- Hair -->
    <path d="M 374,185 C 374,175 385,170 395,172 C 402,174 408,182 405,190 Z" fill="#101010" />
    <!-- Body / Shirt -->
    <path d="M 390,208 C 375,225 365,260 365,300 L 415,300 Z" fill="#FFFFFF" />
    <!-- Legs / Pants -->
    <path d="M 370,300 L 360,400 M 410,300 L 420,400" stroke-width="4" />
    <path d="M 355,400 L 375,400 M 415,400 L 435,400" stroke-width="5" />
    <!-- Arms pushing the green puzzle piece -->
    <path d="M 380,225 L 340,250 M 398,225 L 365,265" />

    <!-- Top Person (Bending down) -->
    <!-- Head -->
    <circle cx="510" cy="115" r="18" fill="#FFFFFF" />
    <!-- Hair -->
    <path d="M 494,110 C 494,100 505,95 515,97 C 522,99 528,107 525,115 Z" fill="#101010" />
    <!-- Body / Shirt -->
    <path d="M 510,133 C 480,140 450,155 450,200 L 530,200 Z" fill="#EEF9D8" />
    <!-- Arms reaching down to align top piece -->
    <path d="M 490,145 L 470,180 M 520,145 L 500,180" />

    <!-- Right Person (Woman standing) -->
    <!-- Head -->
    <circle cx="670" cy="150" r="18" fill="#FFFFFF" />
    <!-- Hair (Long hair) -->
    <path d="M 655,145 C 655,125 685,125 685,145 C 685,175 660,185 660,195" fill="#101010" />
    <!-- Body / Shirt -->
    <path d="M 670,168 C 655,185 635,215 635,260 L 685,260 Z" fill="#FFFFFF" />
    <!-- Legs / Pants -->
    <path d="M 645,260 L 640,360 M 675,260 L 680,360" stroke-width="4" />
    <path d="M 630,360 L 650,360 M 670,360 L 690,360" stroke-width="5" />
    <!-- Arms placing center piece -->
    <path d="M 650,185 L 610,210 M 665,185 L 625,215" />

    <!-- Bottom Right Person (Crouching) -->
    <!-- Head -->
    <circle cx="600" cy="360" r="18" fill="#FFFFFF" />
    <!-- Hair -->
    <path d="M 584,355 C 584,345 595,340 605,342 C 612,344 618,352 615,360 Z" fill="#101010" />
    <!-- Body / Hoodie -->
    <path d="M 600,378 C 580,390 560,430 560,480 L 630,480 Z" fill="#A6E22E" />
    <!-- Arms guiding bottom right piece -->
    <path d="M 580,395 L 550,430 M 610,395 L 580,440" />
  </g>

  <!-- Tiny Decorative Elements (Sparkles, lines) -->
  <g stroke="#A6E22E" stroke-width="2" stroke-linecap="round">
    <!-- Sparkle Top Right -->
    <path d="M 680,100 L 680,90 M 680,100 L 690,100 M 680,100 L 687,93 M 680,100 L 673,93" />
    <path d="M 705,80 L 705,75 M 705,80 L 710,80 M 705,80 L 708,77 M 705,80 L 702,77" />

    <!-- Floating line segments -->
    <path d="M 190,360 A 20,20 0 0 1 210,380" stroke="#9A9A9A" opacity="0.5" />
    <path d="M 610,180 A 15,15 0 0 0 625,195" stroke="#9A9A9A" opacity="0.5" />
  </g>
</svg>
